[project]
name = "erp-backend"
version = "0.1.0"
description = "ERP backend: FastAPI, SQLAlchemy and PostgreSQL"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    # Starlette's TestClient prefers httpx2 and only falls back to httpx with a deprecation warning.
    "httpx2>=2.16",
    "ruff>=0.8",
    "pypdf>=5.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# The local alembic/ directory holds the migration environment, not the library.
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"
